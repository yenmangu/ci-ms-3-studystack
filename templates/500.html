{% extends "base.html" %}
{% block content %}
  <div class="row">
    <div class="col-12 col-lg-8 mx-auto">
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <h1 class="h3 mb-2">500 — Server error</h1>
          <p class="text-muted mb-4">Something went wrong on our side. Please try again in a moment.</p>
          <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-primary" href="{% url 'resources:resource_list' %}">Back to resources</a>
            <a class="btn btn-outline-secondary" href="{% url 'account_login' %}">Log in</a>
          </div>
          <p class="text-muted mt-4 mb-0">If the problem persists, please contact the site administrator.</p>
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
