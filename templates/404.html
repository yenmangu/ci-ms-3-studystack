{% extends "base.html" %}
{% block content %}
  <div class="row">
    <div class="col-12 col-lg-8 mx-auto">
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <h1 class="h3 mb-2">404 — Page not found</h1>
          <p class="text-muted mb-4">
            We couldn’t find the page you were looking for. It may have been moved, deleted, or the URL may be incorrect.
          </p>
          <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-primary" href="{% url 'resources:resource_list' %}">Back to resources</a>
            <a class="btn btn-outline-secondary"
               href="{% url 'resources:resource_create' %}">Add a resource</a>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
